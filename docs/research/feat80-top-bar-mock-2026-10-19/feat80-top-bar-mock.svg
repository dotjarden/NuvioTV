<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a55"/>
      <stop offset="0.55" stop-color="#151b28"/>
      <stop offset="1" stop-color="#0b0e15"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0e15" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#0b0e15" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0b0e15" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4f8f"/>
      <stop offset="1" stop-color="#c06a4a"/>
    </linearGradient>
    <clipPath id="left"><rect x="0" y="0" width="955" height="1080"/></clipPath>
    <clipPath id="right"><rect x="965" y="0" width="955" height="1080"/></clipPath>
  </defs>

  <!-- shared mock Home, drawn twice -->
  <g id="home">
    <rect x="0" y="0" width="955" height="1080" fill="url(#bg)"/>
    <rect x="380" y="0" width="575" height="620" fill="url(#art)" opacity="0.55"/>
    <rect x="0" y="0" width="955" height="620" fill="url(#hero)"/>
    <text x="150" y="330" font-family="Helvetica Neue, Helvetica, Arial" font-size="58" font-weight="700" fill="#ffffff">LINK·CLICK</text>
    <text x="150" y="380" font-family="Helvetica Neue, Helvetica, Arial" font-size="22" fill="#d9dce4">2021 · Animation · Mystère</text>
    <rect x="150" y="405" width="440" height="12" rx="6" fill="#ffffff" opacity="0.35"/>
    <rect x="150" y="428" width="400" height="12" rx="6" fill="#ffffff" opacity="0.35"/>
    <rect x="150" y="451" width="300" height="12" rx="6" fill="#ffffff" opacity="0.35"/>
    <text x="150" y="560" font-family="Helvetica Neue, Helvetica, Arial" font-size="26" font-weight="600" fill="#ffffff">Top 10 séries</text>
    <rect x="150" y="585" width="300" height="168" rx="12" fill="#8a6fae" stroke="#ffffff" stroke-width="5"/>
    <rect x="470" y="585" width="112" height="168" rx="12" fill="#4b6a8a"/>
    <rect x="598" y="585" width="112" height="168" rx="12" fill="#8a4b4b"/>
    <rect x="726" y="585" width="112" height="168" rx="12" fill="#4b8a6a"/>
    <rect x="854" y="585" width="112" height="168" rx="12" fill="#8a7a4b"/>
    <text x="150" y="820" font-family="Helvetica Neue, Helvetica, Arial" font-size="26" font-weight="600" fill="#ffffff">Séries recommandées pour vous</text>
    <rect x="150" y="845" width="112" height="168" rx="12" fill="#5a5f7a"/>
    <rect x="278" y="845" width="112" height="168" rx="12" fill="#7a5a6f"/>
    <rect x="406" y="845" width="112" height="168" rx="12" fill="#5a7a74"/>
    <rect x="534" y="845" width="112" height="168" rx="12" fill="#7a6a5a"/>
    <rect x="662" y="845" width="112" height="168" rx="12" fill="#5a6a7a"/>
    <rect x="790" y="845" width="112" height="168" rx="12" fill="#6f5a7a"/>
  </g>
  <use href="#home" x="965" y="0"/>

  <!-- LEFT: rc9 "Top" = the centred rail moved up -->
  <g clip-path="url(#left)">
    <rect x="16" y="60" width="84" height="560" rx="42" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <g fill="#ffffff">
      <circle cx="58" cy="118" r="24" fill="#3b82f6"/>
      <circle cx="58" cy="190" r="14"/>
      <circle cx="58" cy="262" r="14"/>
      <circle cx="58" cy="334" r="14"/>
      <circle cx="58" cy="406" r="14"/>
      <circle cx="58" cy="478" r="14"/>
      <circle cx="58" cy="560" r="20" fill="#3b82f6"/>
    </g>
  </g>
  <rect x="0" y="1010" width="955" height="70" fill="#000000" opacity="0.7"/>
  <text x="477" y="1056" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial" font-size="30" font-weight="700" fill="#ffffff">rc9 · Rail Position: Top (today)</text>

  <!-- RIGHT: proposed "Top Bar" = horizontal icon strip at the very top-left -->
  <g clip-path="url(#right)">
    <rect x="1045" y="44" width="520" height="76" rx="38" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <g fill="#ffffff">
      <circle cx="1088" cy="82" r="24" fill="#3b82f6"/>
      <circle cx="1160" cy="82" r="14"/>
      <circle cx="1230" cy="82" r="14"/>
      <circle cx="1300" cy="82" r="14"/>
      <circle cx="1370" cy="82" r="14"/>
      <circle cx="1440" cy="82" r="14"/>
      <circle cx="1520" cy="82" r="20" fill="#3b82f6"/>
    </g>
    <text x="1088" y="152" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial" font-size="22" font-weight="600" fill="#ffffff">Accueil</text>
  </g>
  <rect x="965" y="1010" width="955" height="70" fill="#000000" opacity="0.7"/>
  <text x="1442" y="1056" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial" font-size="30" font-weight="700" fill="#ffffff">Proposed · Top Bar (icons, label under the focused one)</text>

  <rect x="955" y="0" width="10" height="1080" fill="#000000"/>
</svg>
