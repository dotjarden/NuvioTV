<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4a66"/>
      <stop offset="0.5" stop-color="#1b2232"/>
      <stop offset="1" stop-color="#0c0f16"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a5aa0"/>
      <stop offset="1" stop-color="#d07a50"/>
    </linearGradient>
    <filter id="glyphShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="p1"><rect x="0" y="0" width="630" height="1080"/></clipPath>
    <clipPath id="p2"><rect x="645" y="0" width="630" height="1080"/></clipPath>
    <clipPath id="p3"><rect x="1290" y="0" width="630" height="1080"/></clipPath>
  </defs>

  <g id="page">
    <rect x="0" y="0" width="630" height="1080" fill="url(#bg)"/>
    <rect x="250" y="0" width="380" height="600" fill="url(#art)" opacity="0.6"/>
    <text x="150" y="300" font-family="Helvetica Neue, Helvetica, Arial" font-size="46" font-weight="700" fill="#fff">LIZZIE BORDEN</text>
    <rect x="150" y="330" width="380" height="12" rx="6" fill="#fff" opacity="0.35"/>
    <rect x="150" y="352" width="330" height="12" rx="6" fill="#fff" opacity="0.35"/>
    <text x="150" y="560" font-family="Helvetica Neue, Helvetica, Arial" font-size="24" font-weight="600" fill="#fff">Continue Watching</text>
    <rect x="150" y="585" width="260" height="146" rx="12" fill="#6a5a8a" stroke="#4a9bff" stroke-width="5"/>
    <rect x="426" y="585" width="260" height="146" rx="12" fill="#4b6a8a"/>
    <rect x="150" y="800" width="112" height="168" rx="12" fill="#5a5f7a"/>
    <rect x="278" y="800" width="112" height="168" rx="12" fill="#7a5a6f"/>
    <rect x="406" y="800" width="112" height="168" rx="12" fill="#5a7a74"/>
    <rect x="534" y="800" width="112" height="168" rx="12" fill="#7a6a5a"/>
  </g>
  <use href="#page" x="645"/>
  <use href="#page" x="1290"/>

  <!-- Panel 1: at rest, Home glyph only, soft shadow, no box -->
  <g clip-path="url(#p1)">
    <g filter="url(#glyphShadow)" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round">
      <path d="M44 92 L58 80 L72 92 L72 108 L44 108 Z"/>
      <rect x="54" y="98" width="8" height="10" fill="#fff" stroke="none"/>
    </g>
  </g>

  <!-- Panel 2: open, Icons Only: the Centre pill (84 wide) anchored top-left -->
  <g clip-path="url(#p2)">
    <rect x="645" y="0" width="630" height="1080" fill="#000" opacity="0.55"/>
    <rect x="661" y="38" width="84" height="556" rx="42" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="703" cy="90" r="28" fill="#2f7bf6"/>
    <g fill="#fff">
      <circle cx="703" cy="164" r="12"/><circle cx="703" cy="238" r="12"/><circle cx="703" cy="312" r="12"/>
      <circle cx="703" cy="386" r="12"/><circle cx="703" cy="460" r="12"/>
    </g>
    <circle cx="703" cy="546" r="22" fill="#2f7bf6"/>
  </g>

  <!-- Panel 3: open, Labels Shown: the Centre pill (300 wide) anchored top-left -->
  <g clip-path="url(#p3)">
    <rect x="1290" y="0" width="630" height="1080" fill="#000" opacity="0.55"/>
    <rect x="1306" y="38" width="300" height="556" rx="42" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="1318" y="60" width="276" height="60" rx="30" fill="#fff"/>
    <circle cx="1348" cy="90" r="14" fill="#2f7bf6"/>
    <text x="1380" y="100" font-family="Helvetica Neue, Helvetica, Arial" font-size="28" font-weight="600" fill="#111">Home</text>
    <g fill="#fff" font-family="Helvetica Neue, Helvetica, Arial" font-size="28">
      <circle cx="1348" cy="164" r="12"/><text x="1380" y="174">Search</text>
      <circle cx="1348" cy="238" r="12"/><text x="1380" y="248">Discover</text>
      <circle cx="1348" cy="312" r="12"/><text x="1380" y="322">Library</text>
      <circle cx="1348" cy="386" r="12"/><text x="1380" y="396">Add-ons</text>
      <circle cx="1348" cy="460" r="12"/><text x="1380" y="470">Settings</text>
    </g>
    <circle cx="1348" cy="546" r="22" fill="#2f7bf6"/>
    <text x="1380" y="556" font-family="Helvetica Neue, Helvetica, Arial" font-size="28" fill="#fff">Test 2</text>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="0" y="1010" width="1920" height="70" fill="#000" opacity="0.75"/>
    <text x="315" y="1055">At rest: Home icon, no box</text>
    <text x="960" y="1055">Open, Icons Only</text>
    <text x="1605" y="1055">Open, Labels Shown</text>
  </g>
  <rect x="630" y="0" width="15" height="1080" fill="#000"/>
  <rect x="1275" y="0" width="15" height="1080" fill="#000"/>
</svg>
